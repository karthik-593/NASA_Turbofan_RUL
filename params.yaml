# Every tunable value the pipeline uses (CLAUDE.md rule 5). `src/turbofan/config.py` reads
# this file once at import and raises on a missing or malformed key. Status of each value
# — LOCKED / ASSUMPTION / REVISIT and its evidence — is in docs/decisions.md (D-IDs below).
# Keys marked "consumed later" are declared for protocol v2 and not read by any code yet.

seed: 42                      # default model seed (D24)

# -- target -----------------------------------------------------------------------------
rul_cap: 125                  # D01 REVISIT
rul_cap_grid: [90, 105, 125, 140]   # D01 plan: CV grid; consumed later

# -- data split -------------------------------------------------------------------------
split_frac: 0.8               # D13: first 80% of engine ids -> train

# -- sensors (D02a/D02b, X04) -----------------------------------------------------------
# use: the sensors the features are built from (default = the current 14-sensor KEEP).
# candidate_pool: the non-constant sensors per reports/data_audit.md §E — the pool a later
# CV feature selection draws from; consumed later.
sensors:
  FD001:
    use: [s2, s3, s4, s7, s8, s9, s11, s12, s13, s14, s15, s17, s20, s21]
    candidate_pool: [s2, s3, s4, s6, s7, s8, s9, s11, s12, s13, s14, s15, s17, s20, s21]
  FD002:
    use: [s2, s3, s4, s7, s8, s9, s11, s12, s13, s14, s15, s17, s20, s21]
    candidate_pool: [s2, s3, s4, s6, s7, s8, s9, s10, s11, s12, s13, s14, s15, s16, s17, s20, s21]
  FD003:
    use: [s2, s3, s4, s7, s8, s9, s11, s12, s13, s14, s15, s17, s20, s21]
    candidate_pool: [s2, s3, s4, s6, s7, s8, s9, s10, s11, s12, s13, s14, s15, s17, s20, s21]
  FD004:
    use: [s2, s3, s4, s7, s8, s9, s11, s12, s13, s14, s15, s17, s20, s21]
    candidate_pool: [s2, s3, s4, s6, s7, s8, s9, s10, s11, s12, s13, s14, s15, s16, s17, s20, s21]

# -- operating regimes (D03, D04a, D04b, D05) -------------------------------------------
# One code path: KMeans with k = n_regimes on standardized op settings, per-regime z-score.
# k = 1 is the global z-score.
n_regimes: {FD001: 1, FD002: 6, FD003: 1, FD004: 6}
regime_kmeans:
  n_init: 10
  random_state: 0

# -- features (D07, D08, D10) -----------------------------------------------------------
window: 20                    # rolling mean/slope window (D08)
seq_len: 30                   # LSTM sequence length (D10)
seq_len_grid: [20, 30, 45]    # consumed later

# -- feature blocks (D51, Stage A3): the defaults are the base feature set ------------------
features:
  extra_sensors: []           # sensors added to sensors.use for this run (must be in the
                              # candidate_pool of pipeline.dataset); 3 features each
  health_index: none          # none | consistent | pooled: PC1 of within-regime z, fit per fold
  hi_consistent_share: 0.9    # audit §E rule: a sensor is direction-consistent if >= this share
                              # of engines share the majority sign of rho(z, time to failure)
  regime_onehot: false        # one indicator column per fitted regime (multi-regime datasets)

# -- models (D20-D22) -------------------------------------------------------------------
models:
  ridge:
    alpha: 1.0
  rf:
    n_estimators: 300
  xgboost:                    # wrapper defaults; tuned params override them (D21)
    early_stopping_rounds: 50
    params:
      n_estimators: 500
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      reg_alpha: 0.1
      reg_lambda: 1.0
      tree_method: hist
      eval_metric: rmse
      n_jobs: -1
  lstm:
    hidden: 32
    layers: 2
    dropout: 0.3
    head_hidden: 16
    lr: 0.001
    max_epochs: 100
    patience: 10              # early stopping, epochs without val improvement
    min_delta: 0.0001         # val-MSE improvement that resets patience
    batch_size: 256
    grad_clip_norm: 1.0
    lr_plateau_patience: 5
    lr_plateau_factor: 0.5

# -- evaluation (D16, D18, D19, D24) ----------------------------------------------------
eval:
  cap_test_truth: false       # ASSUMPTION (D40): headline metrics vs uncapped test truth;
                              # scoring always reports both (<metric>_vs_capped/_vs_uncapped)
buckets:                      # maintenance buckets, lower bound inclusive (D19)
  critical: [0, 25]
  urgent: [25, 50]
  monitor: [50, 100]
  healthy: [100, .inf]
seeds: [42, 7, 123, 2024, 99] # multi-seed robustness (D24)

# -- engine subpopulations (D35): CV stratification and per-group reporting only --------
subpopulation:
  k: 2                        # audit §I: the permutation-supported 2-way split
  kmeans_n_init: 10
  kmeans_random_state: 0

# -- protocol v2 (D46): model selection never reads the test set ------------------------
cv:
  n_folds: 5                  # StratifiedGroupKFold: groups = engine, stratify = subpopulation
  n_repeats: 3                # reshuffled repeats of the K-fold split
  seed: 0
  group_by: unit
  inner_val_frac: 0.2         # share of each fold's training engines held out for early
                              # stopping (never the fold's held-out engines)
benchmark_view:               # D46: truncation points matching the NASA test label histogram
  bin_width: 10               # cycles per true-RUL bin
  points_per_engine: 5        # sampled points per held-out engine
decision_curve:               # D46: rule "remove when predicted RUL <= T"; ASSUMPTION grid
  t_min: 0
  t_max: 125
  t_step: 5
  lead_times: [10, 20, 30]    # ASSUMPTION: lead times (cycles) a removal must leave to count
  matched_lead_time: 20       # ASSUMPTION (D47): L of the matched-operating-point comparison
  wasted_life_budgets: [20, 30, 40]  # ASSUMPTION (D47): mean wasted life (cycles) at which
                              # models are compared; linear interpolation along the T grid
bootstrap:                    # engine-level bootstrap for every CV metric (rule 4)
  n_boot: 1000
  ci_level: 0.95

# -- serving ----------------------------------------------------------------------------
validation:
  envelope_margin: 0.25       # D41: fraction of the training range (sensors) / regime radius
                              # (op settings) tolerated beyond it at serving
serving:
  min_history: 10             # ASSUMPTION (D39): fewest cycles /predict accepts; shorter
                              # histories than seq_len are padded + masked (D11)

# -- pipeline (dvc.yaml; D48) -----------------------------------------------------------
pipeline:
  dataset: FD001              # the dataset the cv_select / train_prod / register stages run on
  models: [mean, ridge, xgboost, lstm]
  seeds: [42]                 # model seeds of cv_select (a subset of `seeds`; D24)
  resume: true                # cv_select reloads splits MLflow already holds (D49)
release:
  spec: locked.yaml           # the locked candidate (evaluation.spec format); written by a human
                              # after reading reports/protocol_v2.md, never by the pipeline
final_eval:
  enabled: false              # true = the final_eval stage reads the sealed NASA test set
                              # (once per locked spec; the stage still passes --confirm)
  expectations: configs/data_expectations.json   # row / unit counts the test files must match
                              # (structure only) before anything is scored
selection:                    # D51, pre-registered in reports/model_selection.md §0
  seed: 42                    # Stage A/B screening seed
  window_grid: [20, 30, 45]   # A2 (incumbent: window); A1 uses rul_cap_grid, B1 seq_len_grid
  extra_sensors:              # A3 sensors+: audit §E "informative, not in sensors.use"
    FD001: [s6]
    FD002: [s6, s10, s16]
    FD003: [s6, s10]
    FD004: [s6, s10, s16]
  identifiability:            # A4
    n_cycles: [30, 50, 100]
    logreg_c: 1.0
    auc_strong_lower: 0.80    # "strong" = AUC 95% CI lower bound >= this
smoke:                        # `python -m turbofan.pipeline all --smoke`: isolated, minutes
  n_engines: 10               # training engines kept (balanced over subpopulations)
  max_folds: 1                # splits run (of overrides.cv.n_folds x n_repeats)
  spec_model: lstm            # candidate the generated smoke spec locks (exercises the budget)
  overrides:                  # merged over this file for the smoke run only
    pipeline: {dataset: FD001}
    cv: {n_folds: 2, n_repeats: 1, inner_val_frac: 0.4}  # 2 = fewest folds StratifiedGroupKFold
                              # allows; 0.4 keeps >= 2 inner-validation engines of 5
    bootstrap: {n_boot: 50}
    models:
      xgboost: {params: {n_estimators: 20}}
      lstm: {max_epochs: 3, patience: 2}
