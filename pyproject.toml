[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turbofan-rul-prediction"
version = "0.1.0"
description = "Predictive maintenance on the NASA C-MAPSS turbofan dataset"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "xgboost>=2.0.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
mlops = ["mlflow>=2.13.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "scipy>=1.13.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
]

[tool.uv]
dev-dependencies = [
    "optuna>=3.6.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "scipy>=1.13.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/turbofan"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/turbofan --cov-report=term-missing"
