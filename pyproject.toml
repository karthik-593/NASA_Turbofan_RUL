[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turbofan-rul-prediction"
version = "0.1.0"
description = "Predictive maintenance on the NASA C-MAPSS turbofan dataset"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "xgboost>=2.0.0",
    "joblib>=1.4.0",
    "mlflow>=2.13.0",
    "pyyaml>=6.0",
    "threadpoolctl>=3.5",
    "scipy>=1.13.0",
    "pandera>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "httpx>=0.27.0",
    "dvc>=3.67.1",
    "types-pyyaml>=6.0.12.20260906",
    "optuna>=3.6.0",
]

# Local dev env only (D45): on Windows PyPI's torch is CPU-only, so take the CUDA 13.0 build
# (matches the NVIDIA driver's CUDA version, same torch version as the Docker image's pin).
# Other platforms use PyPI's torch unchanged. The Docker serve image does not read this: it
# installs CPU torch from the CPU index and requirements.lock (docker/Dockerfile).
[tool.uv]
# Keep the dev torch at the version the Docker image pins (docker/Dockerfile): only the build
# (CPU -> CUDA) changes here, not the version.
constraint-dependencies = ["torch==2.11.0; sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/turbofan"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/turbofan --cov-report=term-missing"
markers = [
    "requires_data: needs the real C-MAPSS raw files (dvc pull); see tests/conftest.py",
]
