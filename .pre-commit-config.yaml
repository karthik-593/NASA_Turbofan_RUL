repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        # Narrative notebooks keep their outputs in git (decisions.md D37). Strip only what
        # changes on every run: execution counts (stripped unless --keep-count), cell
        # execution timestamps, widget state and kernel info.
        args:
          - --keep-output
          - --extra-keys
          - >-
            metadata.kernelspec metadata.language_info metadata.widgets
            cell.metadata.execution cell.metadata.ExecuteTime

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: debug-statements
